name: Build Windows portable
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  relocate-release:
    if: contains(github.event.head_commit.message, '[relocate-release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the original published Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          file="HexDroid-Dreams-0.1.0-Windows-x64.zip"
          tag="dreams-windows-v0.1.0"
          base="https://github.com/Malekira/HexDroid-Dreams-Android/releases/download/$tag"
          curl --fail --location --retry 3 "$base/$file" --output "release/$file"
          curl --fail --location --retry 3 "$base/${file%.zip}.sha256" --output "release/${file%.zip}.sha256"
          (cd release && sha256sum --check "${file%.zip}.sha256")
          echo "c852a7824eba64347f58b4c22be92d7bf49b2aa998ed9d23c5a0cdeda2d52225  release/$file" | sha256sum --check -
          gh release create "$tag" "release/$file" "release/${file%.zip}.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "HexDroid Dreams 0.1.0 para Windows — versión de prueba" \
            --notes-file RELEASE-NOTES.md --prerelease --latest=false
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build:win
      - run: node scripts/package-artifacts.js
      - uses: actions/upload-artifact@v4
        with:
          name: HexDroid-Dreams-Windows-x64
          path: dist/HexDroid-Dreams-0.1.0-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
  release:
    if: contains(github.event.head_commit.message, '[release]')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HexDroid-Dreams-Windows-x64
          path: release
      - name: Publish tested Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          file="HexDroid-Dreams-${version}-Windows-x64.zip"
          (cd release && sha256sum "$file" > "${file%.zip}.sha256")
          gh release create "dreams-windows-v${version}" "release/$file" "release/${file%.zip}.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HexDroid Dreams ${version} para Windows — versión de prueba" \
            --notes-file RELEASE-NOTES.md --prerelease --latest=false
