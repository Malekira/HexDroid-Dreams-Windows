name: Build Windows portable
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/install-electron.cjs
      - run: npm test
      - run: npm run test:desktop
        timeout-minutes: 3
      - name: Test desktop interface
        shell: pwsh
        run: |
          $env:CHROMIUM_PATH = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run build:win
      - name: Verify packaged launch without debugger
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP "dreams-normal-boot"
          New-Item -ItemType Directory -Force $probeDir | Out-Null
          $exe = (Resolve-Path "dist/HexDreamsIRC-win32-x64/HexDreamsIRC.exe").Path
          $boot = Start-Process -FilePath $exe -ArgumentList "--user-data-dir=$probeDir/profile" -PassThru -RedirectStandardOutput "$probeDir/stdout.log" -RedirectStandardError "$probeDir/stderr.log"
          try {
            $ready = $false
            for ($i = 0; $i -lt 80; $i++) {
              if ((Test-Path "$probeDir/profile/startup.log") -and (Select-String -Path "$probeDir/profile/startup.log" -Pattern "Ventana preparada" -Quiet)) { $ready = $true; break }
              Start-Sleep -Milliseconds 250
            }
            Get-Content "$probeDir/profile/startup.log", "$probeDir/stdout.log", "$probeDir/stderr.log" -ErrorAction SilentlyContinue
            if (-not $ready) { throw "El ejecutable empaquetado no preparó la ventana." }
          } finally {
            Stop-Process -Id $boot.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Test packaged Windows executable
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:DREAMS_BINARY = (Resolve-Path "dist/HexDreamsIRC-win32-x64/HexDreamsIRC.exe").Path
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node scripts/package-artifacts.js
      - uses: actions/upload-artifact@v4
        with:
          name: HexDreams-IRC-Windows-x64
          path: dist/HexDreams-IRC-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
  release:
    if: contains(github.event.head_commit.message, '[release]')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HexDreams-IRC-Windows-x64
          path: release
      - name: Publish tested Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          file="HexDreams-IRC-${version}-Windows-x64.zip"
          (cd release && sha256sum "$file" > "${file%.zip}.sha256")
          gh release create "dreams-windows-v${version}" "release/$file" "release/${file%.zip}.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HexDreams IRC ${version} para Windows — versión de prueba" \
            --notes-file RELEASE-NOTES.md --prerelease --latest=false
